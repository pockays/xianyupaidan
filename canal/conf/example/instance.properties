#################################################
## mysql serverId
canal.instance.mysql.slaveId = 1234

## mysql address
canal.instance.master.address = mysql:3306
canal.instance.master.journal.name =
canal.instance.master.position =
canal.instance.master.timestamp =

## replication username/password
canal.instance.dbUsername = canal
canal.instance.dbPassword = canal
canal.instance.defaultDatabaseName = xianyupaidan
canal.instance.connectionCharset = UTF-8

## table subscription regex
canal.instance.filter.regex = xianyupaidan\\..*

## blacklist: exclude audit_log to prevent infinite CDC loop
canal.instance.filter.black.regex = xianyupaidan\\.audit_log

## Kafka topic routing
canal.mq.topic = xianyupaidan-audit
canal.mq.dynamicTopic = false
