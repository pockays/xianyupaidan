server {
    listen       80;
    listen       443 ssl;
    server_name  47.96.112.211;

    # 指向 acme.sh 签发的一次性证书绝对路径
    ssl_certificate     /root/.acme.sh/47.96.112.211_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/47.96.112.211_ecc/47.96.112.211.key;

    # 推荐的安全 SSL 参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /danmu {
        proxy_pass http://danmu:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /hls {
        proxy_pass http://douyu-hls:8088;
        proxy_set_header Host $host;
    }

    # Static files with SPA fallback
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
